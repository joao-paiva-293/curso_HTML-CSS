<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Zombie';
            src: url('fonts/Zombie Blood.otf') format('truetype'), url('fonts/Zombie Blood.ttf') format('opentype');
            font-weight: normal;
            font-style: normal;

            /*
            
            Tipos de format()
            - opentype (otf)
            -truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }
        body{
            font-family: Zombie, Helvetica, sans-serif
            
        }
        h1{
            font-family: 'Zombie', Times, serif;
            font-size: 3em;
        }
        p{
            font-size: 17px;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum quas excepturi hic tenetur labore accusantium quia adipisci ab, iure rerum voluptates sint nesciunt cumque nisi, vel corporis soluta unde! Quibusdam!</p>
</body>
</html>
