<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse <br>
    sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li><span title="Se usa a tag <p>">Parágrafo</span></li>
        <li><span title="Se usa as tags <h1> ... <h6>">Títulos</span></li>
        <li><span title="Se usa a tag <img>">Imagens</span></li>
        <li><span title="Se usa a tag <abbr>">Abreviações</span></li>
        <li><span title="Se usa a tag <code>">Códigos-fonte</span></li>
        <li><span title="Se usa as tags <ol> e <li>">Listas numeradas</span></li>
        <li><span title="Se usa as tags <ul> e <li>">Listas com demarcadores</span></li>
    </ul>
</body>
</html>
